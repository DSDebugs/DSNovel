name: DSNovel
options:
  bundleIdPrefix: com.dsnovel
  deploymentTarget:
    iOS: "27.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_NAME: DSNovel
    PRODUCT_BUNDLE_IDENTIFIER: com.dsnovel.app
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleDisplayName: DSNovel
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  DSNovel:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/DSNovel
        excludes:
          - "Resources/**"
    resources:
      - path: Sources/DSNovel/Resources/Assets.xcassets
      - path: Sources/DSNovel/Resources/Plugins
    info:
      path: Sources/DSNovel/Resources/Info.plist
      properties:
        CFBundleName: DSNovel
        CFBundleDisplayName: DSNovel
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "110"
        CFBundleShortVersionString: "11.0.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
