name: DSNovel
options:
  bundleIdPrefix: com.dsnovel
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_NAME: DSNovel
    PRODUCT_BUNDLE_IDENTIFIER: com.dsnovel.app
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleDisplayName: DSNovel
    MARKETING_VERSION: "12.0.0"
    CURRENT_PROJECT_VERSION: "120"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_IDENTITY: ""

targets:
  DSNovel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/DSNovel
        excludes:
          - "Resources/**"
    resources:
      - path: Sources/DSNovel/Resources/Assets.xcassets
      - path: Sources/DSNovel/Resources/PrivacyInfo.xcprivacy
    info:
      path: Sources/DSNovel/Resources/Info.plist
      properties:
        CFBundleName: DSNovel
        CFBundleDisplayName: DSNovel
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio

  DSNovelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/DSNovelTests
    dependencies:
      - target: DSNovel
