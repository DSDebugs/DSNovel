name: DSNovel
options:
  bundleIdPrefix: com.dsnovel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  DSNovel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DSNovel
        excludes:
          - "Resources/**"
      - path: DSNovel/Resources/Assets.xcassets
        buildPhase: resources
      - path: DSNovel/Resources/prelude.js
        buildPhase: resources
      - path: DSNovel/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    info:
      path: DSNovel/Resources/Info.plist
      properties:
        CFBundleDisplayName: DSNovel
        CFBundleName: DSNovel
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsnovel.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: DSNovel/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  DSNovelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DSNovelTests
    dependencies:
      - target: DSNovel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsnovel.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DSNovel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DSNovel"
        BUNDLE_LOADER: "$(TEST_HOST)"
