name: DSNovel
options:
  bundleIdPrefix: com.dsnovel
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  DSCore:
    path: Packages/DSCore
  DSStorage:
    path: Packages/DSStorage
  DSPluginKit:
    path: Packages/DSPluginKit
  DSPlayback:
    path: Packages/DSPlayback
  DSDownloads:
    path: Packages/DSDownloads
  DSDesignSystem:
    path: Packages/DSDesignSystem

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      CODE_SIGNING_ALLOWED: NO

targets:
  DSNovel:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
        excludes:
          - "Resources/**"
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
      - path: App/Resources/prelude.js
        buildPhase: resources
      - path: App/Resources/prelude_parser.js
        buildPhase: resources
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/BundledSources/ShunAudiobookPro-v5.6.zip
        buildPhase: resources
      - path: App/Resources/BundledParsers/ximalaya_parser-v1.5.5.js
        buildPhase: resources
    dependencies:
      - package: DSCore
      - package: DSStorage
      - package: DSPluginKit
      - package: DSPlayback
      - package: DSDownloads
      - package: DSDesignSystem
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        CFBundleDisplayName: DSNovel
        CFBundleName: DSNovel
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsnovel.v3
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  DSNovelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/DSNovelTests
    dependencies:
      - target: DSNovel
      - package: DSCore
      - package: DSStorage
      - package: DSPluginKit
      - package: DSPlayback
      - package: DSDownloads
      - package: DSDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsnovel.v3.tests
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DSNovel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DSNovel"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DSNovelUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/DSNovelUITests
    dependencies:
      - target: DSNovel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsnovel.v3.uitests
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DSNovel

schemes:
  DSNovel:
    build:
      targets:
        DSNovel: all
        DSNovelTests: [test]
        DSNovelUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DSNovelTests
        - DSNovelUITests
