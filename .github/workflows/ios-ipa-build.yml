name: Build DSNovel v3 Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "打包前运行模拟器单元测试与 UI 冒烟测试 (DSNovelTests + DSNovelUITests)"
        type: boolean
        default: true
      create_release:
        description: "同时创建 GitHub Release 并附带 IPA"
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  build-ipa:
    name: Build Unsigned iOS 26 IPA (v3.3.9)
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version_tag: ${{ steps.meta.outputs.version_tag }}
      ipa_name: ${{ steps.meta.outputs.ipa_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare CI Logs Directory
        run: |
          set -euo pipefail
          mkdir -p ci-logs

      - name: Select Xcode 26+ & Verify iOS SDK
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version | tee ci-logs/env.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a ci-logs/env.txt

      - name: Run 22 Static Architecture & Design Rules (verify_rules.sh)
        run: |
          set -euo pipefail
          bash scripts/verify_rules.sh 2>&1 | tee ci-logs/verify-rules.log

      # AUD-100: Cache npm package archive for acorn@8.14.0 to speed up repeated CI runs
      - name: Cache npm (acorn)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-acorn-8.14.0
          restore-keys: |
            ${{ runner.os }}-npm-acorn-

      - name: Run JS Runtime Selfcheck, Standalone Fuzz, Bundled JS Syntax & Manifest BOM Check
        run: |
          set -euo pipefail
          TMP_NODE_DIR="$(mktemp -d)"
          TMP_JS_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_NODE_DIR" "$TMP_JS_DIR"' EXIT
          npm install --prefix "$TMP_NODE_DIR" --prefer-offline --no-save --no-audit --no-fund acorn@8.14.0 2>&1 | tee ci-logs/js-selfcheck.log
          NODE_PATH="$TMP_NODE_DIR/node_modules" node parser-tools/ep_selfcheck.js 2>&1 | tee -a ci-logs/js-selfcheck.log
          NODE_PATH="$TMP_NODE_DIR/node_modules" node parser-tools/ep_fuzz.js 2>&1 | tee -a ci-logs/js-selfcheck.log
          node --check App/Resources/prelude.js 2>&1 | tee -a ci-logs/js-selfcheck.log
          node --check App/Resources/prelude_parser.js 2>&1 | tee -a ci-logs/js-selfcheck.log
          node --check App/Resources/BundledParsers/ximalaya_parser-v1.5.5.js 2>&1 | tee -a ci-logs/js-selfcheck.log
          BUNDLE_ZIP="App/Resources/BundledSources/ShunAudiobookPro-v5.6.zip"
          if [ ! -f "$BUNDLE_ZIP" ]; then
            echo "::error::Missing bundled source archive: $BUNDLE_ZIP"
            exit 1
          fi
          unzip -qq "$BUNDLE_ZIP" -d "$TMP_JS_DIR"
          python3 - "$TMP_JS_DIR/manifest.json" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          raw = p.read_bytes()
          if raw.startswith(b"\xef\xbb\xbf"):
              raise SystemExit("FAIL: manifest.json contains UTF-8 BOM")
          data = json.loads(raw.decode("utf-8"))
          assert data.get("scripts"), "manifest.json scripts empty"
          print(f"OK: manifest.json BOM-free, scripts={data['scripts']}")
          PY
          for js in "$TMP_JS_DIR"/*.js; do
            echo "Checking bundled JS: $(basename "$js")" | tee -a ci-logs/js-selfcheck.log
            node --check "$js" 2>&1 | tee -a ci-logs/js-selfcheck.log
          done
          NODE_PATH="$TMP_NODE_DIR/node_modules" node - "$TMP_JS_DIR" <<'NODE' 2>&1 | tee -a ci-logs/js-selfcheck.log
          const fs = require("fs");
          const path = require("path");
          const acorn = require("acorn");
          const tmpDir = process.argv[2];
          const targets = [
            "App/Resources/prelude.js",
            "App/Resources/prelude_parser.js",
            "App/Resources/BundledParsers/ximalaya_parser-v1.5.5.js",
            ...fs.readdirSync(tmpDir).filter(f => f.endsWith(".js")).sort().map(f => path.join(tmpDir, f))
          ];
          for (const file of targets) {
            acorn.parse(fs.readFileSync(file, "utf8"), { ecmaVersion: 5 });
            console.log("ES5 acorn OK:", path.basename(file));
          }
          NODE
          rm -rf "$TMP_JS_DIR" "$TMP_NODE_DIR"

      # AUD-100: Cache Homebrew downloads to avoid re-fetching XcodeGen bottle on cache hit
      - name: Cache Homebrew (XcodeGen)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-xcodegen-v1
          restore-keys: |
            ${{ runner.os }}-brew-xcodegen-

      - name: Install XcodeGen & Generate Xcode Project
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate 2>&1 | tee ci-logs/xcodegen.log
          xcodebuild -list -project DSNovel.xcodeproj 2>&1 | tee -a ci-logs/xcodegen.log

      - name: Run Unit Tests & UI Smoke Tests (Simulator + Coverage)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          set -euo pipefail
          SIM_ID="$(python3 - <<'PY'
          import json, re, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"], text=True)
          data = json.loads(raw).get("devices", {})
          preferred = [
              r"^iPhone 17 Pro$", r"^iPhone 17$",
              r"^iPhone 16 Pro$", r"^iPhone 16$",
              r"^iPhone 15 Pro$", r"^iPhone 15$",
              r"^iPhone ",
          ]
          candidates = []
          for runtime, devs in sorted(data.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d.get("isAvailable"):
                      candidates.append((runtime, d.get("name", ""), d.get("udid", "")))
          for pat in preferred:
              rx = re.compile(pat)
              for _, name, udid in candidates:
                  if rx.search(name) and udid:
                      print(udid)
                      sys.exit(0)
          sys.exit(1)
          PY
          )"
          if [ -z "$SIM_ID" ]; then
            echo "::error::No available iPhone simulator found for tests"
            exit 1
          fi
          echo "Using simulator ID: $SIM_ID" | tee -a ci-logs/env.txt

          REPO_ROOT="$(pwd)"
          : > ci-logs/spm-tests.log
          for pkg in DSCore DSStorage DSDesignSystem DSPluginKit DSPlayback DSDownloads; do
            echo "=== Testing Local SPM Package: $pkg ===" | tee -a ci-logs/spm-tests.log
            (
              cd "$REPO_ROOT/Packages/$pkg"
              xcodebuild test \
                -scheme "$pkg" \
                -destination "platform=iOS Simulator,id=$SIM_ID" \
                -derivedDataPath "$RUNNER_TEMP/DerivedDataSPM"
            ) 2>&1 | tee -a ci-logs/spm-tests.log
          done

          rm -rf ci-logs/DSNovelTests.xcresult
          xcodebuild test \
            -project DSNovel.xcodeproj \
            -scheme DSNovel \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath ci-logs/DSNovelTests.xcresult 2>&1 | tee ci-logs/xcodebuild-test.log

          if [ ! -d ci-logs/DSNovelTests.xcresult ]; then
            echo "::error::Missing xcresult bundle at ci-logs/DSNovelTests.xcresult"
            exit 1
          fi
          echo "=== Code Coverage Summary ==="
          xcrun xccov view --report --only-targets ci-logs/DSNovelTests.xcresult 2>&1 | tee ci-logs/coverage-summary.txt

      - name: Build Unsigned Release App (iphoneos)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project DSNovel.xcodeproj \
            -scheme DSNovel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-logs/xcodebuild-release.log

      - name: Verify 8 Required Resources, Binary & Package Unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DSNovel.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::DSNovel.app not found at $APP_PATH"
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          if [ "$BUNDLE_ID" != "com.dsnovel.app" ]; then
            echo "::error::CFBundleIdentifier mismatch: expected com.dsnovel.app, got $BUNDLE_ID"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP_PATH/Info.plist" | grep -q audio; then
            echo "::error::Missing UIBackgroundModes=audio in Info.plist"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$APP_PATH/Info.plist" | grep -q zh-Hans; then
            echo "::error::Missing CFBundleLocalizations=zh-Hans in Info.plist"
            exit 1
          fi

          if ! test -x "$APP_PATH/DSNovel"; then
            echo "::error::Executable binary missing or not executable: $APP_PATH/DSNovel"
            exit 1
          fi
          if ! lipo -info "$APP_PATH/DSNovel" | grep -q arm64; then
            echo "::error::DSNovel binary does not contain arm64 architecture slice"
            exit 1
          fi

          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          if [ "$BUILD_NUMBER" != "${{ github.run_number }}" ]; then
            echo "::error::CFBundleVersion mismatch: expected ${{ github.run_number }}, got $BUILD_NUMBER"
            exit 1
          fi
          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          VERSION_TAG="v${MARKETING_VERSION}-b${BUILD_NUMBER}"
          IPA_NAME="DSNovel-${VERSION_TAG}.ipa"

          echo "=== Hard 8-Resource Verification ==="
          MISSING=0
          for f in Info.plist Assets.car PkgInfo prelude.js prelude_parser.js PrivacyInfo.xcprivacy ShunAudiobookPro-v5.6.zip ximalaya_parser-v1.5.5.js; do
            if [ -e "$APP_PATH/$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [FAIL] missing required resource: $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::Missing $MISSING required resource(s) inside DSNovel.app"
            exit 1
          fi

          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/DSNovel.app
          zip -qry "$IPA_NAME" Payload
          rm -rf Payload

          unzip -tq "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" | tee ci-logs/ipa-sha256.txt

          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Extract Error Summary for Mobile & Export
        if: always()
        run: |
          set -euo pipefail
          {
            echo "=== DSNovel v3 CI Error & Failure Summary (Run #${{ github.run_number }}) ==="
            for f in ci-logs/verify-rules.log ci-logs/js-selfcheck.log ci-logs/xcodegen.log ci-logs/spm-tests.log ci-logs/xcodebuild-test.log ci-logs/xcodebuild-release.log; do
              if [ -f "$f" ]; then
                echo ""
                echo "--- $f ---"
                grep -nE -C 2 ": error:|fatal error:|\[FAIL\]|\*\* TEST FAILED \*\*|\*\* BUILD FAILED \*\*|Test Case .* failed" "$f" | head -n 200 || echo "(no error lines matched)"
              fi
            done
            if [ -f ci-logs/coverage-summary.txt ]; then
              echo ""
              echo "--- Coverage Summary ---"
              cat ci-logs/coverage-summary.txt
            fi
          } > ci-logs/errors-summary.txt

          {
            echo "### 构建报错与覆盖率精简摘要 (Run #${{ github.run_number }})"
            echo '```text'
            head -n 120 ci-logs/errors-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build, Coverage & xcresult Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSNovel-v3-ci-logs-b${{ github.run_number }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSNovel-${{ env.VERSION_TAG }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Expose Release Outputs
        id: meta
        run: |
          set -euo pipefail
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Publish GitHub Release
    needs: build-ipa
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
    permissions:
      contents: write
    steps:
      - name: Download Unsigned IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: DSNovel-${{ needs.build-ipa.outputs.version_tag }}
          path: .

      - name: Publish GitHub Release (Tag or Manual)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ needs.build-ipa.outputs.version_tag }}
          IPA_NAME: ${{ needs.build-ipa.outputs.ipa_name }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TAG_NAME="${VERSION_TAG}"
          fi
          if gh release view "$TAG_NAME" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$IPA_NAME" -R "${{ github.repository }}" --clobber
          else
            gh release create "$TAG_NAME" "$IPA_NAME" \
              -R "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "DSNovel $TAG_NAME" \
              --notes "Automated unsigned iOS 26/27 IPA build (v3.3.9) from workflow run #${{ github.run_number }}."
          fi
