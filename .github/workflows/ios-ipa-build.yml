name: Build DSNovel Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "打包前运行模拟器单元测试 (DSNovelTests)"
        type: boolean
        default: true
      create_release:
        description: "同时创建 GitHub Release 并附带 IPA"
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Unsigned iOS 26 IPA
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      version_tag: ${{ steps.meta.outputs.version_tag }}
      ipa_name: ${{ steps.meta.outputs.ipa_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare CI Logs Directory
        run: mkdir -p ci-logs

      - name: Select Xcode 26+ & Verify iOS SDK
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version | tee ci-logs/env.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a ci-logs/env.txt

      - name: Run Static Architecture & Design Rules (verify_rules.sh)
        run: bash scripts/verify_rules.sh 2>&1 | tee ci-logs/verify-rules.log

      - name: Run JS Runtime Selfcheck & Bundled Source JS Syntax Check
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund acorn 2>&1 | tee ci-logs/js-selfcheck.log
          node parser-tools/ep_selfcheck.js 2>&1 | tee -a ci-logs/js-selfcheck.log
          BUNDLE_ZIP="DSNovel/Resources/BundledSources/ShunAudiobookPro-v5.6.zip"
          if [ -f "$BUNDLE_ZIP" ]; then
            TMP_JS_DIR="$(mktemp -d)"
            unzip -qq "$BUNDLE_ZIP" -d "$TMP_JS_DIR"
            for js in "$TMP_JS_DIR"/*.js; do
              echo "Checking bundled JS: $(basename "$js")" | tee -a ci-logs/js-selfcheck.log
              node --check "$js" 2>&1 | tee -a ci-logs/js-selfcheck.log
            done
            rm -rf "$TMP_JS_DIR"
          fi

      - name: Install XcodeGen & Generate Xcode Project
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate 2>&1 | tee ci-logs/xcodegen.log
          xcodebuild -list -project DSNovel.xcodeproj 2>&1 | tee -a ci-logs/xcodegen.log

      - name: Cache SwiftPM Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Unit Tests (Simulator)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          set -o pipefail
          SIM_LINE=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(|iPhone 16 \(|iPhone 15 Pro \(" | head -n 1 || true)
          if [ -z "$SIM_LINE" ]; then
            SIM_LINE=$(xcrun simctl list devices available | grep -E "iPhone" | tail -n 1 || true)
          fi
          SIM_ID=$(echo "$SIM_LINE" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -z "$SIM_ID" ]; then
            echo "::error::No available iPhone simulator found for unit tests"
            exit 1
          fi
          echo "Using simulator ID: $SIM_ID" | tee -a ci-logs/env.txt
          xcodebuild test \
            -project DSNovel.xcodeproj \
            -scheme DSNovel \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-logs/xcodebuild-test.log

      - name: Build Unsigned Release App (iphoneos)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project DSNovel.xcodeproj \
            -scheme DSNovel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-logs/xcodebuild-release.log

      - name: Package Versioned Unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/DSNovel.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::DSNovel.app not found at $APP_PATH"
            exit 1
          fi

          BUILD_NUMBER="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PATH/Info.plist"
          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          VERSION_TAG="v${MARKETING_VERSION}-b${BUILD_NUMBER}"
          IPA_NAME="DSNovel-${VERSION_TAG}.ipa"

          echo "=== Bundled Resources Check ==="
          for f in Info.plist Assets.car PkgInfo prelude.js prelude_parser.js PrivacyInfo.xcprivacy ShunAudiobookPro-v5.6.zip; do
            if [ -e "$APP_PATH/$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [WARN] missing $f"
            fi
          done

          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/DSNovel.app
          zip -qry "$IPA_NAME" Payload
          rm -rf Payload

          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Extract Error Summary for Mobile & Export
        if: always()
        run: |
          {
            echo "=== DSNovel CI Error & Failure Summary (Run #${{ github.run_number }}) ==="
            for f in ci-logs/xcodebuild-test.log ci-logs/xcodebuild-release.log; do
              if [ -f "$f" ]; then
                echo ""
                echo "--- $f ---"
                grep -nE ": error:|fatal error:|\*\* TEST FAILED \*\*|\*\* BUILD FAILED \*\*|Test Case .* failed" "$f" -C 2 | head -n 200 || echo "(no error lines matched)"
              fi
            done
          } > ci-logs/errors-summary.txt

          {
            echo "### 构建报错精简摘要 (Run #${{ github.run_number }})"
            echo '```text'
            head -n 120 ci-logs/errors-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build & Error Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSNovel-ci-logs-b${{ github.run_number }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSNovel-${{ env.VERSION_TAG }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Expose Release Outputs
        id: meta
        run: |
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Publish GitHub Release
    needs: build-ipa
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
    permissions:
      contents: write
    steps:
      - name: Download Unsigned IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: DSNovel-${{ needs.build-ipa.outputs.version_tag }}
          path: .

      - name: Publish GitHub Release (Tag or Manual)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.build-ipa.outputs.version_tag }}
          IPA_NAME: ${{ needs.build-ipa.outputs.ipa_name }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TAG_NAME="${VERSION_TAG}"
          fi
          gh release create "$TAG_NAME" "$IPA_NAME" \
            --title "DSNovel $TAG_NAME" \
            --notes "Automated unsigned iOS 26/27 IPA build from workflow run #${{ github.run_number }}." \
            || gh release upload "$TAG_NAME" "$IPA_NAME" --clobber
