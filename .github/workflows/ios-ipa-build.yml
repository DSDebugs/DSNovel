name: BuildUnsignedIPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Xcode 26 & iOS 26 SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run Architecture & Design Rules Verification (V1)
        run: bash scripts/verify_rules.sh

      - name: Generate Xcode Project via XcodeGen
        run: |
          brew list xcodegen || brew install xcodegen
          xcodegen generate

      - name: Run Unit Tests (V2)
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -n "$SIM_ID" ]; then
            xcodebuild test \
              -project DSNovel.xcodeproj \
              -scheme DSNovel \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              CODE_SIGNING_ALLOWED=NO || true
          fi

      - name: Build Unsigned Release App
        run: |
          xcodebuild clean build \
            -project DSNovel.xcodeproj \
            -scheme DSNovel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 版本号：把构建号写进 app 并让 IPA 文件名带版本号，便于与旧包区分。
      - name: Package Versioned Unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/DSNovel.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::DSNovel.app not found at $APP_PATH"
            exit 1
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PATH/Info.plist"
          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          VERSION_TAG="v${MARKETING_VERSION}-b${BUILD_NUMBER}"

          echo "=== bundled resources check ==="
          for f in Info.plist Assets.car PkgInfo prelude.js prelude_parser.js PrivacyInfo.xcprivacy ShunAudiobookPro-v5.6.zip; do
            if [ -e "$APP_PATH/$f" ]; then echo "  [OK] $f"; else echo "  [WARN] missing $f"; fi
          done

          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/DSNovel.app
          zip -qry "DSNovel-${VERSION_TAG}.ipa" Payload
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          ls -lh "DSNovel-${VERSION_TAG}.ipa"

      - name: Upload Versioned Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSNovel-${{ env.VERSION_TAG }}
          path: DSNovel-*.ipa
          if-no-files-found: error
          retention-days: 7
