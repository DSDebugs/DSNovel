name: Build & Test DSNovel iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Run Unit Tests (DSNovelTests)
        run: |
          DEST=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -n "${DEST}" ]; then
            xcodebuild test \
              -project DSNovel.xcodeproj \
              -scheme DSNovel \
              -destination "id=${DEST}" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Build Unsigned Release App
        run: |
          xcodebuild clean build \
            -project DSNovel.xcodeproj \
            -scheme DSNovel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package DSNovel.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "DSNovel.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "Error: DSNovel.app not found!"
            exit 1
          fi
          cp -R "${APP_PATH}" Payload/
          zip -r9 DSNovel-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSNovel-iOS-IPA
          path: DSNovel-iOS.ipa
