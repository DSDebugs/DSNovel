# DSNovel — builds an UNSIGNED .ipa for the app that lives in THIS repository.
#
# Compliance / acceptable-use constraints (GitHub Terms for Additional Products
# and Features + Acceptable Use Policies):
#   * The job does nothing except produce/test/release this repo's own software.
#   * No schedule/cron, no fork events, no matrix fan-out, no self-hosted runner.
#   * Only official GitHub Actions are used; no community/third-party actions.
#   * The only outbound download is Homebrew installing XcodeGen (the project
#     generator). No curl/wget of binaries, no scraping, no external API polling.
#   * Least-privilege token, serialized runs, hard timeout, short artifact
#     retention: keeps macOS runner usage (10x minute multiplier) minimal.
#   * No signing keys / Apple credentials are stored or used -> unsigned IPA.

name: Build DSNovel iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/ios27-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsnovel-ipa-build
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA (Xcode 27 / iOS 27 SDK)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Xcode and iOS 27 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          SDK_VER=$(xcodebuild -showsdks | grep iphoneos | tail -n 1 | awk '{print $NF}' | sed 's/iphoneos//')
          echo "Detected iOS SDK: ${SDK_VER}"
          if [ -z "${SDK_VER}" ]; then
            echo "::error::No iOS SDK found on this runner"
            exit 1
          fi
          MAJOR="${SDK_VER%%.*}"
          if [ "${MAJOR}" -lt 27 ]; then
            echo "::error::This project requires the iOS 27 SDK. Use the xcode-27 runner image (got ${SDK_VER})."
            exit 1
          fi

      - name: Install XcodeGen (only when missing)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project DSNovel.xcodeproj

      - name: Build unsigned Release app
        run: |
          xcodebuild clean build \
            -project DSNovel.xcodeproj \
            -scheme DSNovel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build -name "DSNovel.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "::error::DSNovel.app not found in build output"
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          OUT="DSNovel-iOS27-v7.0-unsigned.ipa"
          rm -f "${OUT}"
          zip -q -r -9 "${OUT}" Payload
          unzip -l "${OUT}" | head -20
          ls -lh "${OUT}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSNovel-iOS27-unsigned-ipa
          path: DSNovel-iOS27-v7.0-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
