name: Build DSNovel iOS 27 IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Adapt Deployment Target to Runner SDK & Generate Xcode Project
        run: |
          SDK_VER=$(xcodebuild -showsdks | grep iphoneos | tail -n 1 | awk '{print $NF}' | sed 's/iphoneos//')
          echo "Detected GitHub Runner iOS SDK: ${SDK_VER}"
          if [ -z "${SDK_VER}" ]; then
            SDK_VER="17.0"
          fi
          sed -i '' "s/27.0/${SDK_VER}/g" project.yml
          rm -f Package.swift
          xcodegen generate

      - name: Build Unsigned Release App
        run: |
          xcodebuild clean build \
            -project DSNovel.xcodeproj \
            -scheme DSNovel \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package DSNovel.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "DSNovel.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "Error: DSNovel.app not found!"
            exit 1
          fi
          cp -R "${APP_PATH}" Payload/
          zip -r9 DSNovel-iOS27.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSNovel-iOS27-IPA
          path: DSNovel-iOS27.ipa
