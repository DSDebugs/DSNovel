disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - nesting

included:
  - DSNovel
  - DSNovelTests

excluded:
  - DSNovel/PluginKit
  - build
  - DerivedData

custom_rules:
  no_ios_availability:
    name: "No #available(iOS) or @available(iOS)"
    regex: '(#available\(iOS|@available\(iOS)'
    message: "最低部署目标为 iOS 26 (D-1)，禁止使用 #available(iOS 或 @available(iOS。"
    severity: error
  no_fatalerror_container:
    name: "No fatalError on ModelContainer init"
    regex: 'fatalError\("无法初始化'
    message: "数据库初始化失败必须降级到 DataRepairView (T0-04)，禁止 fatalError。"
    severity: error
